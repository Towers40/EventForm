<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Safari no muestra de forma fiable un favicon SVG: hace falta .ico y PNG.
         El orden importa poco (cada navegador elige), pero el .ico va primero
         porque es el que buscan los que no leen estas etiquetas. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Pestañas ancladas de Safari: silueta monocroma que él tiñe. -->
    <link rel="mask-icon" href="/mask-icon.svg" color="#5ee07f" />
    <!-- iOS NO admite SVG en apple-touch-icon: sin este PNG, al añadir la app
         a la pantalla de inicio sale una miniatura de la web en vez del logo. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#131628" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TapIn" />
    <title>TapIn — Eventos y entradas con QR</title>
    <meta name="description" content="Crea eventos, gestiona inscritos y controla el acceso con códigos QR. Descubre qué está pasando en tu ciudad." />

    <!-- Previsualización al compartir el enlace (WhatsApp, Instagram, X…).
         No existía ninguna, por eso el enlace salía sin imagen ni descripción.
         Las redes NO leen SVG: la imagen tiene que ser PNG y con URL absoluta. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TapIn" />
    <meta property="og:title" content="TapIn — Eventos y entradas con QR" />
    <meta property="og:description" content="Crea eventos, gestiona inscritos y controla el acceso con códigos QR." />
    <meta property="og:image" content="https://event-form-navy.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_CO" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TapIn — Eventos y entradas con QR" />
    <meta name="twitter:description" content="Crea eventos, gestiona inscritos y controla el acceso con códigos QR." />
    <meta name="twitter:image" content="https://event-form-navy.vercel.app/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
